{% extends 'base.html' %}

{% block title %}{{ pelicula.titulo }} - Cine Premier{% endblock %}

{% block content %}
<main class="contenedor-detalle">
    <div class="tarjeta-detalle">
        <div class="detalle-poster">
            <img src="{{ url_for('static', filename='img/posters/' + pelicula.poster_url) }}" alt="{{ pelicula.titulo }}">
        </div>
        <div class="detalle-info">
            <h2>{{ pelicula.titulo }}</h2>
            <span class="clasificacion clasificacion-{{ pelicula.clasificacion|lower }}">{{ pelicula.clasificacion }}</span>
            <p class="detalle-meta">
                <span>{{ pelicula.genero }}</span> ·
                <span>{{ pelicula.duracion_minutos }} min</span>
            </p>
            <h3>Sinopsis</h3>
            <p class="detalle-sinopsis">{{ pelicula.sinopsis }}</p>
        </div>
    </div>
</main>
{% endblock %}
