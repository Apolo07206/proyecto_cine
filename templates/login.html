<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <title>Iniciar Sesión</title>
</head>
<body>
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="logo" class="logo" width="530px">

    <div class="tarjeta-users">
        <h1>Iniciar sesión</h1>
        
        <form action="/login" method="post">
            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Ingrese su contraseña" required>
            </div>

            <button type="submit" class="btn-primary">Iniciar sesión</button>
        </form>

        <div class="acciones-extra">
            <a href="{{ url_for('home') }}" class="btn-secundario">Atrás</a>
             <a href="{{url_for('registro')}}" class="btn-tercer"> Registrate aqui</a>
        </div>
    </div>
</body>
</html>
