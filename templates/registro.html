<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/registro.css') }}">
    <title>Registrarse</title>
</head>
<body>


    
    <div class="fondo">
    <!-- Capa del DIV (ej. oscurecer el fondo) -->
    <div class="capa-overlay"></div>
    
    <!-- Capa de la IMG (ej. imagen de fondo con efectos) -->
    <img src="{{ url_for('static', filename='img/fondo_cine.png') }}" alt="Fondo Cine" class="img-fondo">
    </div>




    <div class="tarjeta-users">
        <h1>Registrarse</h1>
        
        <form action="/registro" method="post">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <!-- Corrección: el type estándar para texto es "text" -->
                <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>
            </div>

            <div class="campo">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" placeholder="Ejemplo@gmail.com" required>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Ingrese su contraseña" required>
            </div>

            <div class="campo">
                <label for="rol">Rol</label>
                <!-- Opción recomendada: <select> para obligar al usuario a elegir una opción válida sin errores -->
                <select id="rol" name="rol" required>
                    <option value="" disabled selected>Seleccione un Rol</option>
                    <option value="admin">admin</option>
                    <option value="cliente">cliente</option>
                </select>
            </div>

            <button type="submit" class="btn-primary">Registrarse</button>
        </form>

        <div class="acciones-extra">
            <a href="{{ url_for('home') }}" class="btn-secundario">Atrás</a>
        </div>
    </div>
</body>
</html>
