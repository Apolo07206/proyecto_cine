<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{url_for('static', filename='img/logo.png')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/home.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/usuario.css')}}">
    <title>Mi Cuenta - Cine Premier</title>
</head>
<body>
    <header class="header-cabezado">
        <div class="navegacion">
            <div class="titulo-imagen">
                <a href="{{ url_for('home') }}" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
                    <img src="{{url_for('static', filename='img/logo_cortado.png')}}" alt="Logo Cine Premier" width="80px">
                    <h2>Cine Premier</h2>
                </a>
            </div>

            <nav>
                <ul>
                    <li class="usuario-bloque" title="{{ session['nombre'] }}">
                        <img src="{{url_for('static', filename='img/icono_de_usuario.png')}}" alt="Usuario" class="usuario-icono">
                        <span class="usuario-nombre">{{ session['nombre'] }}</span>
                    </li>
                    <li><a href="{{url_for('logout')}}">Cerrar sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contenedor-usuario">
        <div class="tarjeta-usuario">
            <div class="avatar-grande">
                <img src="{{url_for('static', filename='img/icono_de_usuario.png')}}" alt="Usuario">
            </div>
            <h2>{{ usuario.nombre }}</h2>
            <p class="correo-usuario">{{ usuario.correo }}</p>
            <span class="rol-badge rol-{{ usuario.rol }}">{{ usuario.rol|capitalize }}</span>
        </div>

        <div class="acciones-usuario">
            <a href="{{ url_for('mapa_silla') }}" class="accion-card">
                <span class="accion-icono">🎟️</span>
                <h3>Comprar Boletas</h3>
                <p>Selecciona tu función y aparta tu asiento</p>
            </a>
            <a href="{{ url_for('home') }}" class="accion-card">
                <span class="accion-icono">🎬</span>
                <h3>Ver Cartelera</h3>
                <p>Consulta las películas en función</p>
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Cine Premier</p>
    </footer>
</body>
</html>
